<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Área do Paciente | Nutricionista Thales Rosa</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
@font-face{font-family:"Galano Grotesque Alt";src:url("assets/fonts/GalanoGrotesqueAltRegular.otf") format("opentype");font-weight:400;font-style:normal;font-display:swap;}
@font-face{font-family:"Galano Grotesque Alt";src:url("assets/fonts/GalanoGrotesqueAltMedium.otf") format("opentype");font-weight:500;font-style:normal;font-display:swap;}
@font-face{font-family:"Galano Grotesque Alt";src:url("assets/fonts/GalanoGrotesqueAltSemiBold.otf") format("opentype");font-weight:600;font-style:normal;font-display:swap;}
@font-face{font-family:"Galano Grotesque Alt";src:url("assets/fonts/GalanoGrotesqueAltBold.otf") format("opentype");font-weight:700;font-style:normal;font-display:swap;}
body{margin:0;font-family:"Galano Grotesque Alt",system-ui,sans-serif;background:#faf9f6;-webkit-font-smoothing:antialiased;}
a{color:inherit;text-decoration:none;}
a:hover{color:#0fae62;}
.cta{transition:transform .2s ease,background .2s ease;}
.cta:hover{background:#0fae62 !important;color:#fff !important;transform:translateY(-2px);}
.btn-outline:hover{background:#14181a !important;color:#fff !important;}
button[type="submit"]:hover{background:#0fae62 !important;color:#fff !important;}
</style>
</head>
<body>
<section style="padding:100px 0;text-align:center;">
  <div style="max-width:420px;margin:0 auto;padding:0 24px;box-sizing:border-box;">
    <span style="text-transform:uppercase;letter-spacing:.12em;font-size:.82rem;font-weight:700;color:#0fae62;display:block;margin-bottom:12px;">Área do paciente</span>

    <div id="loggedView" style="display:none;">
      <h1 style="font-family:'Galano Grotesque Alt',sans-serif;letter-spacing:-0.02em;font-size:clamp(1.8rem,3.4vw,2.4rem);margin:0 0 .5em;color:#14181a;">Bem-vindo (a) de volta</h1>
      <p id="loadingMsg" style="font-size:1.05rem;color:#5b6660;margin:0 0 1.5em;">Buscando sua página...</p>
      <div id="pagesList" style="display:flex;flex-direction:column;gap:10px;margin-bottom:14px;"></div>
      <a href="#" id="logoutBtn" style="display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 26px;border-radius:999px;font-weight:600;font-size:.95rem;border:2px solid #14181a;color:#14181a;" class="btn-outline">Sair</a>
    </div>

    <div id="loginView">
      <h1 style="font-family:'Galano Grotesque Alt',sans-serif;letter-spacing:-0.02em;font-size:clamp(1.8rem,3.4vw,2.4rem);margin:0 0 .3em;color:#14181a;">Entrar</h1>
      <p style="font-size:1rem;color:#5b6660;margin:0 0 1.6em;">Acesse com o e-mail e senha cadastrados no seu acompanhamento.</p>
      <form id="loginForm" style="text-align:left;background:#fff;border:1px solid #e7ebe9;border-radius:16px;padding:32px;box-shadow:0 8px 28px -14px rgba(20,24,26,.15);box-sizing:border-box;">
        <label style="display:block;font-weight:600;font-size:.9rem;margin-bottom:6px;color:#14181a;">E-mail</label>
        <input type="email" id="emailInput" required style="width:100%;padding:12px 14px;border:1px solid #e7ebe9;border-radius:8px;font-size:1rem;margin-bottom:16px;box-sizing:border-box;font-family:inherit;">
        <label style="display:block;font-weight:600;font-size:.9rem;margin-bottom:6px;color:#14181a;">Senha</label>
        <input type="password" id="passwordInput" required style="width:100%;padding:12px 14px;border:1px solid #e7ebe9;border-radius:8px;font-size:1rem;margin-bottom:8px;box-sizing:border-box;font-family:inherit;">
        <p id="errorMsg" style="color:#c0392b;font-size:.88rem;margin:8px 0 0;display:none;"></p>
        <button type="submit" id="submitBtn" style="display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:20px;padding:14px 26px;border-radius:999px;font-weight:600;font-size:.98rem;border:none;background:#1adc7f;color:#04140c;cursor:pointer;box-sizing:border-box;">Entrar</button>
      </form>
      <p style="font-size:.9rem;color:#5b6660;margin-top:20px;">Ainda não tem acesso? <a href="mailto:contato@nutrithales.com.br" style="color:#0fae62;font-weight:600;">Fale comigo</a> para liberar seu login.</p>
    </div>
  </div>
</section>

<script>
// Configure com as credenciais do seu projeto Supabase antes de publicar:
const SUPABASE_URL = 'https://xwihrxinweeadtcouhoo.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_9rdUCvfgWydLr4vA-uQvHQ_FWwgggLk';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const loginView = document.getElementById('loggedView') ? document.getElementById('loginView') : null;
const loggedView = document.getElementById('loggedView');
const loadingMsg = document.getElementById('loadingMsg');
const pagesList = document.getElementById('pagesList');
const errorMsg = document.getElementById('errorMsg');
const submitBtn = document.getElementById('submitBtn');

function showLoggedIn() {
  document.getElementById('loginView').style.display = 'none';
  loggedView.style.display = 'block';
}
function showLoginForm() {
  document.getElementById('loginView').style.display = 'block';
  loggedView.style.display = 'none';
}

async function fetchPatientPages(userId) {
  loadingMsg.style.display = 'block';
  pagesList.innerHTML = '';
  const { data, error } = await sb.from('paginas_paciente').select('titulo, url_pagina').eq('user_id', userId);
  loadingMsg.style.display = 'none';
  if (error || !data || data.length === 0) {
    loadingMsg.textContent = 'Nenhuma página encontrada ainda.';
    loadingMsg.style.display = 'block';
    return;
  }
  data.forEach(pg => {
    const a = document.createElement('a');
    a.href = pg.url_pagina; a.target = '_blank'; a.rel = 'noopener';
    a.className = 'cta';
    a.style.cssText = 'display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 26px;border-radius:999px;font-weight:600;font-size:.98rem;background:#1adc7f;color:#04140c;';
    a.textContent = pg.titulo;
    pagesList.appendChild(a);
  });
}

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  errorMsg.style.display = 'none';
  submitBtn.textContent = 'Entrando…'; submitBtn.disabled = true;
  const email = document.getElementById('emailInput').value;
  const password = document.getElementById('passwordInput').value;
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  submitBtn.textContent = 'Entrar'; submitBtn.disabled = false;
  if (error) { errorMsg.textContent = 'E-mail ou senha incorretos.'; errorMsg.style.display = 'block'; return; }
  showLoggedIn();
  fetchPatientPages(data.session.user.id);
});

document.getElementById('logoutBtn').addEventListener('click', async (e) => {
  e.preventDefault();
  await sb.auth.signOut();
  showLoginForm();
});

(async function init() {
  const { data } = await sb.auth.getSession();
  if (data.session) { showLoggedIn(); fetchPatientPages(data.session.user.id); }
})();
</script>
</body>
</html>
