name: Production Safety

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-safety-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Preflight build and isolation
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate build, JavaScript and domain isolation
        run: node scripts/safety-check.mjs
      - name: Validate security headers and critical route contracts
        run: node scripts/security-regression-check.mjs

  production-smoke:
    name: Production smoke test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wait for deployment propagation
        run: sleep 20
      - name: Check homepage
        run: |
          body=$(curl --fail --silent --show-error --location --retry 4 --retry-delay 5 https://www.nutrithales.com.br/)
          echo "$body" | grep -q 'Nutricionista em Curitiba'
      - name: Check privacy policy
        run: |
          body=$(curl --fail --silent --show-error --location --retry 4 --retry-delay 5 https://www.nutrithales.com.br/politica-de-privacidade/)
          echo "$body" | grep -q 'Política de Privacidade'
          echo "$body" | grep -q 'LGPD'
      - name: Check public article
        run: |
          body=$(curl --fail --silent --show-error --location --retry 4 --retry-delay 5 https://www.nutrithales.com.br/conteudos/avaliacao-fisica-com-bodymetrix.html)
          echo "$body" | grep -q 'BodyMetrix'
      - name: Check HTTPS and defensive headers
        run: |
          headers=$(curl --fail --silent --show-error --head --retry 4 --retry-delay 5 https://www.nutrithales.com.br/ | tr -d '\r')
          echo "$headers" | grep -qi '^strict-transport-security:'
          echo "$headers" | grep -qi '^x-content-type-options: nosniff$'
          echo "$headers" | grep -qi '^referrer-policy: strict-origin-when-cross-origin$'
          echo "$headers" | grep -qi '^content-security-policy-report-only:'
          redirect=$(curl --silent --show-error --head http://www.nutrithales.com.br/ | tr -d '\r')
          echo "$redirect" | grep -Eq '^HTTP/.* (301|302|307|308)'
          echo "$redirect" | grep -qi '^location: https://'
      - name: Check patient area
        run: |
          body=$(curl --fail --silent --show-error --location --retry 4 --retry-delay 5 https://www.nutrithales.com.br/paciente)
          echo "$body" | grep -q 'Área do Paciente'
          if echo "$body" | grep -qi 'admin.nutrithales.com.br'; then exit 1; fi
      - name: Check workout dashboard
        run: |
          body=$(curl --fail --silent --show-error --location --retry 4 --retry-delay 5 https://www.nutrithales.com.br/paciente/treinos)
          echo "$body" | grep -q 'Dashboard de Treinos'
          if echo "$body" | grep -qi 'admin.nutrithales.com.br'; then exit 1; fi
