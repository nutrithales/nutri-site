<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Treino Vinicius | Nutri. Thales Rosa</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
@font-face{font-family:"Galano";src:url("/assets/fonts/GalanoGrotesqueAltRegular.otf") format("opentype");font-weight:400;font-display:swap}
@font-face{font-family:"Galano";src:url("/assets/fonts/GalanoGrotesqueAltSemiBold.otf") format("opentype");font-weight:600;font-display:swap}
@font-face{font-family:"Galano";src:url("/assets/fonts/GalanoGrotesqueAltBold.otf") format("opentype");font-weight:700;font-display:swap}
:root{--bg:#0E1A14;--card:#14241c;--card2:#1a2e24;--line:#294337;--green:#19DD7F;--green2:#0fad62;--text:#F5FFF9;--muted:#9DB3A7;--danger:#ff8d8d;--shadow:0 18px 48px rgba(0,0,0,.24)}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:linear-gradient(180deg,#0E1A14 0%,#0A130F 100%);color:var(--text);font-family:"Galano",system-ui,-apple-system,sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased}a{color:inherit;text-decoration:none}button,input,textarea{font:inherit}.hidden{display:none!important}.shell{width:min(980px,100%);margin:auto;padding:16px 14px 110px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.brand{font-weight:800;letter-spacing:.03em}.back{font-size:13px;color:var(--muted);font-weight:700}.logout{border:1px solid var(--line);background:var(--card2);color:var(--text);border-radius:12px;padding:10px 13px;font-weight:700}.hero{background:linear-gradient(145deg,#172a20,#102018);border:1px solid var(--line);border-radius:24px;padding:20px;box-shadow:var(--shadow);margin-bottom:14px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--green);font-weight:800}.hero h1{font-size:clamp(28px,8vw,42px);letter-spacing:-.04em;line-height:1;margin:8px 0 9px}.hero p{margin:0;color:var(--muted);line-height:1.5}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}.metric{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px}.metric b{font-size:24px;display:block}.metric span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.section-title{display:flex;align-items:end;justify-content:space-between;gap:10px;margin:22px 0 10px}.section-title h2{margin:0;font-size:20px}.section-title p{margin:0;font-size:12px;color:var(--muted)}.tabs{display:flex;gap:8px;overflow:auto;padding-bottom:5px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tab{white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:999px;padding:10px 14px;cursor:pointer}.tab.active{background:var(--green);border-color:var(--green);color:#07120c;font-weight:800}.card{background:rgba(20,36,28,.97);border:1px solid var(--line);border-radius:22px;padding:17px;box-shadow:var(--shadow);margin-bottom:14px}.workout-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:6px}.workout-head h2{font-size:23px;margin:5px 0 4px}.workout-meta{color:var(--muted);font-size:13px;line-height:1.45}.pill{display:inline-flex;border-radius:999px;padding:6px 9px;background:rgba(25,221,127,.12);color:var(--green);font-size:11px;font-weight:800}.timer-box{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#0f1c16;border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin:14px 0}.timer-display{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}.timer-actions{display:flex;gap:7px}.mini{border:1px solid var(--line);background:var(--card2);color:var(--text);border-radius:10px;padding:8px 10px;font-size:12px;font-weight:800}.mini.green{background:var(--green);color:#07120c;border-color:var(--green)}.exercise{border-top:1px solid var(--line);padding:18px 0}.exercise:first-of-type{border-top:0}.exercise-name{font-size:18px;font-weight:800;margin-bottom:5px}.exercise-meta{font-size:13px;color:var(--muted);line-height:1.45}.exercise-note{font-size:13px;color:var(--muted);line-height:1.5;margin-top:9px;white-space:pre-line}.sets{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.set{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:#102018;color:var(--text);font-weight:800}.set.done{background:var(--green);border-color:var(--green);color:#07120c}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.field{display:flex;flex-direction:column;gap:5px}.field label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}.field input,.field textarea{width:100%;background:#0f1c16;border:1px solid var(--line);color:var(--text);border-radius:12px;padding:11px;outline:none}.field input:focus,.field textarea:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(25,221,127,.08)}.video{display:inline-flex;margin-top:10px;border:1px solid var(--line);background:var(--card2);color:var(--green);border-radius:999px;padding:8px 11px;font-size:12px;font-weight:800}.finish{width:100%;border:0;border-radius:14px;background:var(--green);color:#07120c;font-weight:900;padding:14px 16px;margin-top:13px}.save-status{font-size:12px;color:var(--muted);margin-top:8px}.save-status.ok{color:var(--green)}.save-status.error{color:var(--danger)}.history{display:grid;gap:9px}.history-row{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid var(--line);background:#102018;border-radius:14px;padding:12px}.history-title{font-weight:800}.history-meta{font-size:12px;color:var(--muted);margin-top:3px}.history-time{font-size:12px;color:var(--green);font-weight:800;white-space:nowrap}.empty{padding:22px;text-align:center;color:var(--muted);line-height:1.5}.bottom{position:fixed;left:0;right:0;bottom:0;background:rgba(8,15,11,.94);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));z-index:20}.bottom-in{width:min(980px,100%);margin:auto;display:flex;align-items:center;gap:12px}.progress-label{min-width:88px}.progress-label b{font-size:17px}.progress-label span{display:block;font-size:11px;color:var(--muted)}.progress{flex:1;height:9px;border-radius:999px;background:#1d3127;overflow:hidden}.progress>div{height:100%;background:var(--green);width:0;transition:width .2s ease}.loading{max-width:700px;margin:14vh auto;padding:0 18px;color:var(--muted);text-align:center}.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#111f18;border:1px solid var(--line);border-radius:12px;padding:10px 14px;z-index:50;box-shadow:var(--shadow);font-size:13px}
@media(max-width:640px){.shell{padding:13px 11px 108px}.summary{grid-template-columns:repeat(3,1fr);gap:7px}.metric{padding:12px 10px}.metric b{font-size:20px}.metric span{font-size:9px}.hero{border-radius:19px;padding:17px}.card{border-radius:18px;padding:15px}.workout-head{flex-direction:column}.timer-box{align-items:flex-start}.timer-actions{flex-wrap:wrap;justify-content:flex-end}.history-row{align-items:flex-start}.grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div id="loading" class="loading">Carregando seu dashboard de treino…</div>
<div id="app"></div>
<script>
const SUPABASE_URL='https://xwihrxinweeadtcouhoo.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_9rdUCvfgWydLr4vA-uQvHQ_FWwgggLk';
const VINICIUS_ID='20c469e7-43c6-41c3-9f19-b5704ced772b';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const state={user:null,patient:null,workouts:[],active:null,exercises:[],history:[],progress:{exerciseState:{},activeWorkoutId:null,generalObs:{}},saving:false,saved:true,error:'',startedAt:Date.now(),timer:{remaining:0,interval:null}};
let saveTimer=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const first=s=>String(s||'').trim().split(/\s+/)[0]||'Paciente';
function toast(msg){const d=document.createElement('div');d.className='toast';d.textContent=msg;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}
function fail(message){document.getElementById('loading').classList.add('hidden');document.getElementById('app').innerHTML=`<main class="shell"><div class="topbar"><a class="back" href="/paciente">← Área do paciente</a><div class="brand">NUTRI THALES</div></div><div class="card empty">${esc(message)}</div></main>`}
async function boot(){const {data:{session}}=await sb.auth.getSession();if(!session?.user){location.replace('/paciente');return}await load(session.user);sb.auth.onAuthStateChange((event,s)=>{if(event==='SIGNED_OUT'||!s?.user)location.replace('/paciente')})}
async function load(user){state.user=user;const {data:patient,error:pErr}=await sb.from('pacientes').select('id,nome,email,treino_liberado').eq('auth_id',user.id).maybeSingle();if(pErr||!patient){fail('Não foi possível localizar seu cadastro.');return}if(patient.id!==VINICIUS_ID){location.replace('/paciente/treinos');return}if(!patient.treino_liberado){fail('Seu treino ainda não foi liberado.');return}state.patient=patient;const [{data:workouts,error:wErr},{data:progress},{data:history}]=await Promise.all([sb.from('treino_programas').select('*').eq('paciente_id',patient.id).eq('status','ativo').order('ordem'),sb.from('treino_progresso').select('dados').eq('paciente_id',patient.id).maybeSingle(),sb.from('treino_execucoes').select('id,treino_id,iniciado_em,finalizado_em,duracao_seg,concluido,observacoes').eq('paciente_id',patient.id).order('iniciado_em',{ascending:false}).limit(12)]);if(wErr){fail('Não foi possível carregar seus treinos agora.');return}state.workouts=workouts||[];state.history=history||[];if(progress?.dados)state.progress={exerciseState:{},activeWorkoutId:null,generalObs:{},...progress.dados};if(!state.progress.activeWorkoutId||!state.workouts.some(w=>w.id===state.progress.activeWorkoutId))state.progress.activeWorkoutId=state.workouts[0]?.id||null;state.active=state.workouts.find(w=>w.id===state.progress.activeWorkoutId)||state.workouts[0]||null;await loadExercises();state.startedAt=Date.now();document.getElementById('loading').classList.add('hidden');render()}
async function loadExercises(){if(!state.active){state.exercises=[];return}const {data,error}=await sb.from('treino_exercicios').select('*').eq('treino_id',state.active.id).order('bloco_ordem').order('ordem');state.exercises=error?[]:(data||[])}
function exState(id){return state.progress.exerciseState[id]||{load:'',reps:'',sets:{}}}
function completion(){let total=0,done=0;for(const ex of state.exercises){for(let i=1;i<=Number(ex.series||0);i++){total++;if(exState(ex.id).sets?.[i])done++}}return{total,done,pct:total?Math.round(done/total*100):0}}
function setProgress(mut){mut();state.saved=false;state.error='';renderSaveStatus();clearTimeout(saveTimer);saveTimer=setTimeout(saveProgress,600)}
async function saveProgress(){if(!state.patient)return;state.saving=true;renderSaveStatus();const {error}=await sb.from('treino_progresso').upsert({paciente_id:state.patient.id,dados:state.progress},{onConflict:'paciente_id'});state.saving=false;state.saved=!error;state.error=error?'Erro ao salvar':'';renderSaveStatus()}
function renderSaveStatus(){const el=document.getElementById('saveStatus');if(!el)return;if(state.saving){el.textContent='Salvando…';el.className='save-status'}else if(state.saved){el.textContent='Salvo automaticamente';el.className='save-status ok'}else if(state.error){el.textContent=state.error;el.className='save-status error'}else{el.textContent='Alterações pendentes';el.className='save-status'}}
async function switchWorkout(id){if(id===state.active?.id)return;state.progress.activeWorkoutId=id;state.active=state.workouts.find(w=>w.id===id)||state.workouts[0];await loadExercises();state.startedAt=Date.now();setProgress(()=>{});render()}
function toggleSet(exId,n){setProgress(()=>{const e={...exState(exId),sets:{...exState(exId).sets}};e.sets[n]=!e.sets[n];state.progress.exerciseState={...state.progress.exerciseState,[exId]:e}});render()}
function changeField(exId,key,value){setProgress(()=>{const e={...exState(exId),sets:{...exState(exId).sets},[key]:value};state.progress.exerciseState={...state.progress.exerciseState,[exId]:e}})}
function changeObs(v){setProgress(()=>{state.progress.generalObs={...state.progress.generalObs,[state.active.id]:v}})}
function startRest(seconds){clearInterval(state.timer.interval);state.timer.remaining=seconds;drawTimer();state.timer.interval=setInterval(()=>{state.timer.remaining--;drawTimer();if(state.timer.remaining<=0){clearInterval(state.timer.interval);toast('Descanso concluído')}} ,1000)}
function drawTimer(){const el=document.getElementById('timerDisplay');if(!el)return;const s=Math.max(0,state.timer.remaining);el.textContent=`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}
function fmtDate(v){try{return new Intl.DateTimeFormat('pt-BR',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'}).format(new Date(v))}catch{return''}}
function fmtDur(s){s=Number(s||0);const m=Math.floor(s/60),sec=s%60;return m?`${m}min ${sec}s`:`${sec}s`}
async function finishWorkout(){if(!state.active)return;const c=completion();if(c.done<c.total&&!confirm('Ainda existem séries não marcadas. Deseja concluir mesmo assim?'))return;await saveProgress();const now=Date.now();const dur=Math.max(1,Math.round((now-state.startedAt)/1000));const payload={paciente_id:state.patient.id,treino_id:state.active.id,iniciado_em:new Date(state.startedAt).toISOString(),finalizado_em:new Date(now).toISOString(),duracao_seg:dur,concluido:true,observacoes:state.progress.generalObs?.[state.active.id]||'',dados:{exerciseState:state.progress.exerciseState}};const {error}=await sb.from('treino_execucoes').insert(payload);if(error){alert('Não foi possível registrar a conclusão agora. Seu progresso continua salvo.');return}state.history.unshift({...payload,id:crypto.randomUUID()});toast('Treino concluído e registrado');state.startedAt=Date.now();render()}
async function logout(){await sb.auth.signOut();location.replace('/paciente')}
function meta(ex){const p=[];if(ex.series)p.push(`${ex.series} séries`);if(ex.repeticoes)p.push(`${esc(ex.repeticoes)} reps`);if(ex.rir)p.push(`RIR ${esc(ex.rir)}`);if(ex.rpe)p.push(`RPE ${esc(ex.rpe)}`);if(ex.descanso_seg)p.push(`${ex.descanso_seg}s descanso`);if(ex.carga_inicial!=null)p.push(`Carga inicial ${esc(ex.carga_inicial)} kg`);return p.join(' · ')}
function renderHistory(){if(!state.history.length)return '<div class="empty">Nenhuma sessão concluída ainda. Seus treinos aparecerão aqui após a conclusão.</div>';return `<div class="history">${state.history.slice(0,8).map(h=>{const w=state.workouts.find(x=>x.id===h.treino_id);return `<div class="history-row"><div><div class="history-title">${esc(w?.nome||'Treino')}</div><div class="history-meta">${fmtDate(h.iniciado_em)}</div></div><div class="history-time">${fmtDur(h.duracao_seg)}</div></div>`}).join('')}</div>`}
function render(){if(!state.patient)return;const c=completion();const sessions=state.history.filter(h=>h.concluido).length;const tabs=state.workouts.map(w=>`<button class="tab ${state.active?.id===w.id?'active':''}" data-id="${w.id}">${esc(w.nome)}</button>`).join('');const exercises=state.exercises.map(ex=>{const st=exState(ex.id);const sets=Array.from({length:Number(ex.series||0)},(_,i)=>`<button class="set ${st.sets?.[i+1]?'done':''}" data-ex="${ex.id}" data-set="${i+1}">${i+1}</button>`).join('');return `<div class="exercise"><div class="exercise-name">${esc(ex.nome)}</div><div class="exercise-meta">${meta(ex)}</div><div class="sets">${sets}</div><div class="grid"><div class="field"><label>Carga</label><input inputmode="decimal" value="${esc(st.load)}" data-ex="${ex.id}" data-field="load" placeholder="${ex.carga_inicial!=null?esc(ex.carga_inicial)+' kg':'kg'}"></div><div class="field"><label>Repetições</label><input inputmode="numeric" value="${esc(st.reps)}" data-ex="${ex.id}" data-field="reps" placeholder="realizadas"></div></div>${ex.observacoes?`<div class="exercise-note">${esc(ex.observacoes)}</div>`:''}${ex.video_url?`<a class="video" href="${esc(ex.video_url)}" target="_blank" rel="noopener">Ver execução</a>`:''}</div>`}).join('');document.getElementById('app').innerHTML=`<main class="shell"><div class="topbar"><a class="back" href="/paciente">← Área do paciente</a><div class="brand">NUTRI THALES</div><button class="logout" id="logout">Sair</button></div><section class="hero"><div class="eyebrow">Dashboard de treinamento</div><h1>${first(state.patient.nome)}, seu treino está aqui.</h1><p>${esc(state.active?.objetivo||'Acompanhe suas séries, cargas, repetições e evolução em cada sessão.')}</p><div id="saveStatus" class="save-status ok">Salvo automaticamente</div></section><section class="summary"><div class="metric"><b>${state.workouts.length}</b><span>treinos ativos</span></div><div class="metric"><b>${sessions}</b><span>sessões feitas</span></div><div class="metric"><b>${c.pct}%</b><span>treino atual</span></div></section><div class="section-title"><h2>Seus treinos</h2><p>Selecione para começar</p></div><div class="tabs">${tabs}</div>${state.active?`<section class="card"><div class="workout-head"><div><div class="eyebrow">Treino atual</div><h2>${esc(state.active.nome)}</h2><div class="workout-meta">${[state.active.codigo,state.active.bloco,state.active.objetivo].filter(Boolean).map(esc).join(' · ')}</div></div><span class="pill">Ativo</span></div><div class="timer-box"><div><div class="eyebrow">Cronômetro de descanso</div><div class="timer-display" id="timerDisplay">00:00</div></div><div class="timer-actions"><button class="mini" data-rest="60">1 min</button><button class="mini" data-rest="90">1:30</button><button class="mini" data-rest="120">2 min</button></div></div>${exercises||'<div class="empty">Nenhum exercício cadastrado neste treino.</div>'}<div class="field"><label>Observações do treino</label><textarea id="obs" rows="4" placeholder="Como foi a sessão? Alguma dor, dificuldade ou observação?">${esc(state.progress.generalObs?.[state.active.id]||'')}</textarea></div><button class="finish" id="finish">Concluir treino</button></section>`:'<section class="card empty">Nenhum treino ativo encontrado.</section>'}<div class="section-title"><h2>Histórico recente</h2><p>Últimas sessões</p></div><section class="card">${renderHistory()}</section></main><div class="bottom"><div class="bottom-in"><div class="progress-label"><b>${c.pct}%</b><span>${c.done}/${c.total} séries</span></div><div class="progress"><div style="width:${c.pct}%"></div></div></div></div>`;$('#logout').onclick=logout;document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>switchWorkout(b.dataset.id));document.querySelectorAll('.set').forEach(b=>b.onclick=()=>toggleSet(b.dataset.ex,Number(b.dataset.set)));document.querySelectorAll('[data-field]').forEach(i=>i.oninput=()=>changeField(i.dataset.ex,i.dataset.field,i.value));document.querySelectorAll('[data-rest]').forEach(b=>b.onclick=()=>startRest(Number(b.dataset.rest)));if($('#obs'))$('#obs').oninput=e=>changeObs(e.target.value);if($('#finish'))$('#finish').onclick=finishWorkout;renderSaveStatus();drawTimer()}
boot();
</script>
</body>
</html>
