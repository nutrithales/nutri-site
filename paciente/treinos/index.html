<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Treinos | Nutri. Thales Rosa</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
@font-face{font-family:"Galano";src:url("/assets/fonts/GalanoGrotesqueAltRegular.otf") format("opentype");font-weight:400;font-display:swap}
@font-face{font-family:"Galano";src:url("/assets/fonts/GalanoGrotesqueAltSemiBold.otf") format("opentype");font-weight:600;font-display:swap}
@font-face{font-family:"Galano";src:url("/assets/fonts/GalanoGrotesqueAltBold.otf") format("opentype");font-weight:700;font-display:swap}
:root{--bg:#0e1a14;--card:#15251d;--card2:#1b2f25;--line:#294337;--green:#19dd7f;--text:#f5fff9;--muted:#9db3a7;--danger:#ff7d7d;--shadow:0 12px 35px rgba(0,0,0,.22)}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:linear-gradient(180deg,#0e1a14,#0a130f);color:var(--text);font-family:"Galano",system-ui,-apple-system,sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased}a{color:inherit;text-decoration:none}button,input,textarea{font:inherit}.wrap{width:min(920px,100%);margin:auto;padding:18px 16px 96px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:18px}.brand{font-weight:800;letter-spacing:.2px}.tag{font-size:12px;color:var(--green);text-transform:uppercase;letter-spacing:.14em}.top-actions{display:flex;gap:8px;align-items:center}.btn{border:0;border-radius:14px;padding:12px 15px;background:var(--green);color:#07120c;font-weight:800;cursor:pointer}.btn.alt{background:var(--card2);color:var(--text);border:1px solid var(--line)}.btn.danger{background:transparent;color:var(--danger);border:1px solid #6c3737}.btn:disabled{opacity:.55;cursor:default}.card{background:rgba(21,37,29,.96);border:1px solid var(--line);border-radius:20px;padding:17px;box-shadow:var(--shadow);margin-bottom:14px}.hero h1{font-size:27px;margin:4px 0 6px;letter-spacing:-.025em}.hero p{margin:0;color:var(--muted);line-height:1.45}.tabs{display:flex;gap:8px;overflow:auto;padding:0 0 5px;margin-bottom:14px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tab{white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:999px;padding:10px 14px;cursor:pointer}.tab.active{background:var(--green);color:#07120c;border-color:var(--green);font-weight:800}.workout-head{padding-bottom:8px}.workout-head h2{margin:6px 0 3px;font-size:22px;letter-spacing:-.02em}.exercise{padding:16px 0;border-top:1px solid var(--line)}.exercise:first-of-type{border-top:0}.exercise h3{margin:0 0 4px;font-size:17px}.meta{color:var(--muted);font-size:13px;margin-bottom:10px;line-height:1.45}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.field{display:flex;flex-direction:column;gap:5px}.field label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.field input,.field textarea{width:100%;border:1px solid var(--line);background:#0f1c16;color:var(--text);border-radius:12px;padding:11px;outline:none}.field input:focus,.field textarea:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(25,221,127,.09)}.sets{display:flex;gap:7px;flex-wrap:wrap;margin:11px 0}.set{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:#102018;color:var(--text);font-weight:800;cursor:pointer}.set.done{background:var(--green);color:#07120c;border-color:var(--green)}.note{font-size:13px;color:var(--muted);line-height:1.45;margin-top:9px;white-space:pre-line}.video{display:inline-flex;margin-top:10px;padding:8px 10px;border-radius:999px;background:var(--card2);border:1px solid var(--line);color:var(--green);font-size:12px;font-weight:800}.status{font-size:12px;color:var(--muted);margin-top:8px}.status.ok{color:var(--green)}.status.error{color:var(--danger)}.empty{text-align:center;padding:32px 12px;color:var(--muted);line-height:1.5}.loading{max-width:920px;margin:12vh auto 0;padding:0 18px;color:var(--muted);text-align:center}.footerbar{position:fixed;bottom:0;left:0;right:0;background:rgba(8,15,11,.93);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:20}.footerin{width:min(920px,100%);margin:auto;display:flex;justify-content:space-between;align-items:center;gap:12px}.progress{height:8px;background:#1d3127;border-radius:999px;overflow:hidden;flex:1}.progress>div{height:100%;background:var(--green);width:0;transition:width .2s ease}.small{font-size:12px;color:var(--muted)}.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;font-weight:700}.finish-row{display:flex;justify-content:flex-end;margin-top:12px}.hidden{display:none!important}@media(max-width:600px){.wrap{padding:14px 12px 100px}.grid{grid-template-columns:1fr 1fr}.hero h1{font-size:23px}.card{border-radius:17px}.top{align-items:flex-start}.top-actions{flex-direction:column;align-items:stretch}.top .btn{padding:9px 11px}.back{font-size:12px}.finish-row .btn{width:100%}}
</style>
</head>
<body>
<div id="loading" class="loading">Carregando seu treino…</div>
<div id="app"></div>
<script>
const SUPABASE_URL='https://xwihrxinweeadtcouhoo.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_9rdUCvfgWydLr4vA-uQvHQ_FWwgggLk';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const state={user:null,patient:null,workouts:[],exercises:[],active:null,progress:{exerciseState:{},activeWorkoutId:null,generalObs:{}},saving:false,saved:true,error:''};
let saveTimer=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function showMessage(message){document.getElementById('loading').classList.add('hidden');document.getElementById('app').innerHTML=`<div class="wrap"><div class="top"><a class="back" href="/paciente">← Área do paciente</a><div class="brand">NUTRI THALES</div></div><div class="card empty">${esc(message)}</div></div>`;}
async function boot(){const {data:{session}}=await sb.auth.getSession();if(!session?.user){location.replace('/paciente');return}await loadUser(session.user);sb.auth.onAuthStateChange(async(event,sessionNow)=>{if(event==='SIGNED_OUT'||!sessionNow?.user){location.replace('/paciente');return}if(sessionNow.user.id!==state.user?.id)await loadUser(sessionNow.user);});}
async function loadUser(user){state.user=user;const {data:patient,error:pErr}=await sb.from('pacientes').select('id,nome,email,status,treino_liberado').eq('auth_id',user.id).maybeSingle();if(pErr||!patient){showMessage('Sua conta está autenticada, mas ainda não está vinculada a um paciente. Fale com o consultório.');return}if(!patient.treino_liberado){showMessage('Seu treino ainda não foi liberado. Assim que o consultório liberar a prescrição, ela aparecerá aqui automaticamente.');return}state.patient=patient;const [{data:workouts,error:wErr},{data:progress,error:prErr}]=await Promise.all([sb.from('treino_programas').select('*').eq('paciente_id',patient.id).eq('status','ativo').order('ordem'),sb.from('treino_progresso').select('dados').eq('paciente_id',patient.id).maybeSingle()]);if(wErr){showMessage('Não foi possível carregar seus treinos agora. Tente novamente em instantes.');return}state.workouts=workouts||[];if(!state.workouts.length){showMessage('Ainda não há treino ativo vinculado à sua conta.');return}if(!prErr&&progress?.dados)state.progress={exerciseState:{},activeWorkoutId:null,generalObs:{},...progress.dados};if(!state.progress.activeWorkoutId||!state.workouts.some(w=>w.id===state.progress.activeWorkoutId))state.progress.activeWorkoutId=state.workouts[0].id;state.active=state.workouts.find(w=>w.id===state.progress.activeWorkoutId)||state.workouts[0];await loadExercises();document.getElementById('loading').classList.add('hidden');render();}
async function loadExercises(){if(!state.active){state.exercises=[];return}const {data,error}=await sb.from('treino_exercicios').select('*').eq('treino_id',state.active.id).order('bloco_ordem').order('ordem');if(error){state.exercises=[];state.error='Não foi possível carregar os exercícios.';return}state.exercises=data||[];}
function exState(id){return state.progress.exerciseState[id]||{load:'',reps:'',sets:{}}}
function setProgress(mut){mut();state.saved=false;state.error='';renderSaveStatus();clearTimeout(saveTimer);saveTimer=setTimeout(saveProgress,600)}
async function saveProgress(){if(!state.patient)return;state.saving=true;renderSaveStatus();const {error}=await sb.from('treino_progresso').upsert({paciente_id:state.patient.id,dados:state.progress},{onConflict:'paciente_id'});state.saving=false;state.saved=!error;state.error=error?'Não foi possível salvar agora.':'';renderSaveStatus()}
function renderSaveStatus(){const el=document.getElementById('saveStatus');if(!el)return;if(state.saving){el.textContent='Salvando…';el.className='status'}else if(state.saved){el.textContent='Salvo automaticamente';el.className='status ok'}else if(state.error){el.textContent=state.error;el.className='status error'}else{el.textContent='Alterações pendentes';el.className='status'}}
async function changeWorkout(id){state.progress.activeWorkoutId=id;state.active=state.workouts.find(w=>w.id===id);await loadExercises();setProgress(()=>{});render()}
function toggleSet(exId,n){setProgress(()=>{const e={...exState(exId),sets:{...exState(exId).sets}};e.sets[n]=!e.sets[n];state.progress.exerciseState={...state.progress.exerciseState,[exId]:e}});render()}
function changeField(exId,key,value){setProgress(()=>{const e={...exState(exId),sets:{...exState(exId).sets},[key]:value};state.progress.exerciseState={...state.progress.exerciseState,[exId]:e}})}
function changeObs(value){setProgress(()=>{state.progress.generalObs={...state.progress.generalObs,[state.active.id]:value}})}
function completion(){let total=0,done=0;for(const ex of state.exercises){for(let i=1;i<=Number(ex.series||0);i++){total++;if(exState(ex.id).sets?.[i])done++}}return{total,done,pct:total?Math.round(done/total*100):0}}
async function finishWorkout(){if(!state.active)return;const c=completion();if(c.done<c.total&&!confirm('Ainda existem séries não marcadas. Deseja concluir mesmo assim?'))return;await saveProgress();const {error}=await sb.from('treino_execucoes').insert({paciente_id:state.patient.id,treino_id:state.active.id,iniciado_em:new Date().toISOString(),finalizado_em:new Date().toISOString(),concluido:true,observacoes:state.progress.generalObs?.[state.active.id]||'',dados:{exerciseState:state.progress.exerciseState}});if(error){alert('Não foi possível registrar a conclusão agora. Seu progresso continua salvo.');return}alert('Treino concluído e registrado!')}
async function logout(){await sb.auth.signOut();location.replace('/paciente')}
function exerciseMeta(ex){const parts=[`${ex.series||0} séries`,esc(ex.repeticoes||'repetições livres')];if(ex.rir)parts.push('RIR '+esc(ex.rir));if(ex.rpe)parts.push('RPE '+esc(ex.rpe));if(ex.descanso_seg)parts.push(ex.descanso_seg+'s descanso');if(ex.carga_inicial!=null)parts.push('Carga inicial '+esc(ex.carga_inicial)+' kg');return parts.join(' · ')}
function render(){if(!state.patient)return;const c=completion();const workoutTabs=state.workouts.map(w=>`<button class="tab ${state.active?.id===w.id?'active':''}" data-id="${w.id}">${esc(w.nome)}</button>`).join('');const exercises=state.exercises.map(ex=>{const st=exState(ex.id);const sets=Array.from({length:Number(ex.series||0)},(_,i)=>`<button class="set ${st.sets?.[i+1]?'done':''}" data-set="${i+1}" data-ex="${ex.id}" aria-label="Série ${i+1}">${i+1}</button>`).join('');return `<div class="exercise"><h3>${esc(ex.nome)}</h3><div class="meta">${exerciseMeta(ex)}</div><div class="sets">${sets}</div><div class="grid"><div class="field"><label>Carga</label><input inputmode="decimal" value="${esc(st.load)}" data-field="load" data-ex="${ex.id}" placeholder="${ex.carga_inicial!=null?esc(ex.carga_inicial)+' kg':'kg'}"></div><div class="field"><label>Repetições</label><input inputmode="numeric" value="${esc(st.reps)}" data-field="reps" data-ex="${ex.id}" placeholder="realizadas"></div></div>${ex.observacoes?`<div class="note">${esc(ex.observacoes)}</div>`:''}${ex.video_url?`<a class="video" href="${esc(ex.video_url)}" target="_blank" rel="noopener">Ver execução do exercício</a>`:''}</div>`}).join('');document.getElementById('app').innerHTML=`<div class="wrap"><div class="top"><div><a class="back" href="/paciente">← Área do paciente</a><div class="brand" style="margin-top:7px">NUTRI THALES</div><div class="tag">Treinamento</div></div><div class="top-actions"><button class="btn alt" id="logout">Sair</button></div></div><div class="card hero"><div class="small">Olá,</div><h1>${esc(state.patient.nome||'Aluno')}</h1><p>${state.active?esc(state.active.objetivo||'Seu treino está pronto para hoje.'):'Nenhum treino ativo cadastrado.'}</p><div id="saveStatus" class="status ok">Salvo automaticamente</div></div>${state.workouts.length?`<div class="tabs">${workoutTabs}</div>`:''}${state.active?`<div class="card"><div class="workout-head"><div class="tag">Treino atual</div><h2>${esc(state.active.nome)}</h2>${state.active.bloco?`<div class="small">${esc(state.active.bloco)}</div>`:''}</div>${exercises||'<div class="empty">Nenhum exercício cadastrado neste treino.</div>'}<div class="field" style="margin-top:15px"><label>Observações do treino</label><textarea id="generalObs" rows="4" placeholder="Como você se sentiu? Alguma dor, dificuldade ou observação?">${esc(state.progress.generalObs?.[state.active.id]||'')}</textarea></div><div class="finish-row"><button class="btn" id="finish">Concluir treino</button></div></div>`:`<div class="card empty">Ainda não há treino ativo vinculado à sua conta.</div>`}</div><div class="footerbar"><div class="footerin"><div style="min-width:92px"><b>${c.pct}%</b><div class="small">${c.done}/${c.total} séries</div></div><div class="progress"><div style="width:${c.pct}%"></div></div></div></div>`;$('#logout').onclick=logout;document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>changeWorkout(b.dataset.id));document.querySelectorAll('.set').forEach(b=>b.onclick=()=>toggleSet(b.dataset.ex,Number(b.dataset.set)));document.querySelectorAll('[data-field]').forEach(i=>i.oninput=()=>changeField(i.dataset.ex,i.dataset.field,i.value));if($('#generalObs'))$('#generalObs').oninput=e=>changeObs(e.target.value);if($('#finish'))$('#finish').onclick=finishWorkout;renderSaveStatus()}
boot();
</script>
</body>
</html>
