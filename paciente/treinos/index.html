:var(--muted);font-weight:800}.notes-card,.actions-card,.evo-card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:17px;box-shadow:var(--shadow);margin-bottom:14px}.actions-card{display:flex;gap:8px;flex-wrap:wrap}.rest-bar{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(430px,calc(100vw - 28px));background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:15px 17px;box-shadow:0 18px 55px rgba(0,0,0,.22);z-index:50}.rest-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}.rest-title{font-size:12px;color:var(--muted);font-weight:800}.rest-time{font-size:23px;font-weight:900;font-variant-numeric:tabular-nums}.rest-track{margin:10px 0}.rest-actions{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.rest-actions button{border:1px solid var(--border);background:var(--surface2);color:var(--text);border-radius:10px;padding:9px 5px;font-size:11px;font-weight:800}.completed{position:fixed;inset:0;background:rgba(3,12,8,.78);display:grid;place-items:center;padding:18px;z-index:80}.completed-card{width:min(450px,100%);background:var(--surface);border:1px solid var(--border);border-radius:26px;padding:25px;box-shadow:0 24px 80px rgba(0,0,0,.35);text-align:center}.completed-icon{width:66px;height:66px;margin:auto;border-radius:50%;display:grid;place-items:center;background:var(--primary);color:#04120b;font-size:30px;font-weight:900}.completed-card h2{font-size:28px;margin:15px 0 6px}.completed-card p{color:var(--muted)}.evo-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.evo-stat{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:16px;box-shadow:var(--shadow)}.evo-stat b{display:block;font-size:20px}.evo-stat span{font-size:11px;color:var(--muted)}.summary-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.summary-box{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:18px;box-shadow:var(--shadow)}.summary-box b{font-size:25px;display:block}.summary-box span{font-size:12px;color:var(--muted)}.summary-detail{font-size:12px;color:var(--muted);margin-top:5px}.heatmap{display:flex;gap:4px;overflow:auto;padding:4px 0}.heatcol{display:flex;flex-direction:column;gap:4px}.heatday{width:14px;height:14px;border-radius:4px;background:var(--surface2);border:1px solid var(--border)}.heatday.on{background:var(--primary);border-color:var(--primary)}.level-row{display:flex;justify-content:space-between;align-items:end}.level-num{font-size:31px;font-weight:900}.xp-track{margin:12px 0 6px}.achievement-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.achievement{background:var(--surface2);border:1px solid var(--border);border-radius:15px;padding:13px}.achievement.locked{opacity:.4}.achievement-icon{font-size:22px}.achievement-title{font-size:13px;font-weight:900;margin-top:6px}.achievement-sub{font-size:10px;color:var(--muted);margin-top:3px}.pr-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.pr{background:var(--surface2);border:1px solid var(--border);border-radius:14px;padding:12px}.pr b{display:block}.pr span{font-size:11px;color:var(--muted)}.history{display:grid;gap:8px}.history-row{display:flex;justify-content:space-between;gap:12px;background:var(--surface2);border:1px solid var(--border);border-radius:14px;padding:12px}.history-title{font-weight:900}.history-meta{font-size:11px;color:var(--muted);margin-top:3px}.history-stats{font-size:11px;color:var(--primary);font-weight:900;text-align:right}.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--deep);color:#effbf3;border:1px solid var(--border);border-radius:999px;padding:11px 17px;font-size:12px;font-weight:800;z-index:90;max-width:calc(100vw - 32px);text-align:center}.empty{text-align:center;padding:28px;color:var(--muted)}.loading{margin:14vh auto;text-align:cen <div id="loading" class="loading">Carregando seu dashboard de treino…</div><div id="app"></div><div id="overlay"></div>
<script>
const SUPABASE_URL='https://xwihrxinweeadtcouhoo.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_9rdUCvfgWydLr4vA-uQvHQ_FWwgggLk';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const GENERAL_GUIDANCE='Superssérie: sem descanso entre os dois exercícios, intervalo só ao concluir ambos. Drop Set: ao final da última série, reduza cerca de 30% da carga e continue até próximo da falha. Rest-Pause: descanse 15s, repita até próximo da falha, descanse mais 15s e faça uma última sequência. Progressão: completou tudo com boa execução? Aumente 2,5%–5% na carga na próxima sessão.';
const state={patient:null,user:null,workouts:[],allExercises:[],active:null,exercises:[],progress:{exerciseState:{},activeWorkoutId:null,generalObs:{},sessions:{}},history:[],tab:'treino',theme:localStorage.getItem('training-theme')||'light',saving:false,saved:true,error:'',tick:null,restTick:null,toastTimer:null};
const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const first=s=>String(s||'').trim().split(/\s+/)[0]||'Paciente';
function applyTheme(){document.body.classList.toggle('dark',state.theme==='dark')}
function formatTime(sec){sec=Math.max(0,Number(sec)||0);const h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=sec%60;return h?`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`:`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`}
function fmtDate(v){try{return new Intl.DateTimeFormat('pt-BR',{day:'2-digit',month:'short',year:'2-digit',hour:'2-digit',minute:'2-digit'}).format(new Date(v))}catch{return''}}
function dayKey(v){const d=new Date(v);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function toast(msg){clearTimeout(state.toastTimer);let t=document.getElementById('toast');if(!t){t=document.createElement('div');t.id='toast';t.className='toast';document.body.appendChild(t)}t.textContent=msg;t.classList.remove('hidden');state.toastTimer=setTimeout(()=>t.classList.add('hidden'),2400)}
function session(){const id=state.active?.id;if(!id)return{started:false,timerRunning:false,elapsedSec:0,rest:null,completed:false,generalObs:''};state.progress.sessions=state.progress.sessions||{};return state.progress.sessions[id]||(state.progress.sessions[id]={started:false,timerRunning:false,elapsedSec:0,rest:null,completed:false,completedAt:null,generalObs:state.progress.generalObs?.[id]||''})}
function setSession(patch){const s=session();Object.assign(s,typeof patch==='function'?patch({...s}):patch);state.progress.generalObs={...(state.progress.generalObs||{}),[state.active.id]:s.generalObs||''};scheduleSave()}
function exState(ex){const raw=state.progress.exerciseState?.[ex.id]||{};let sets=raw.sets;if(!Array.isArray(sets)){const obj=sets||{};sets=Array.from({length:Number(ex.series||0)},(_,i)=>!!obj[i+1])}while(sets.length<Number(ex.series||0))sets.push(false);return{sets:sets.slice(0,Number(ex.series||0)),load:raw.load??'',reps:raw.reps??''}}
function saveEx(ex,next){state.progress.exerciseState={...(state.progress.exerciseState||{}),[ex.id]:next};scheduleSave()}
function scheduleSave(){state.saved=false;renderSave();clearTimeout(state._saveTimer);state._saveTimer=setTimeout(saveProgress,500)}
async function saveProgress(){if(!state.patient)return;state.saving=true;renderSave();const {error}=await sb.from('treino_progresso').upsert({paciente_id:state.patient.id,dados:state.progress},{onConflict:'paciente_id'});state.saving=false;state.saved=!error;state.error=error?'Não foi possível salvar agora.':'';renderSave()}
function renderSave(){const el=$('#saveStatus');if(!el)return;el.textContent=state.saving?'Salvando…':state.saved?'Salvo automaticamente':state.error||'Alterações pendentes';el.className='save '+(state.saved?'ok':state.error?'error':'')}
async function boot(){applyTheme();const {data:{session:s}}=await sb.auth.getSession();if(!s?.user){location.replace('/paciente');return}await load(s.user);sb.auth.onAuthStateChange((event,s2)=>{if(event==='SIGNED_OUT'||!s2?.user)location.replace('/paciente')})}
async function load(user){state.user=user;const {data:patient,error:pErr}=await sb.from('pacientes').select('id,nome,email,treino_liberado').eq('auth_id',user.id).maybeSingle();if(pErr||!patient){fail('Não foi possível localizar seu cadastro.');return}if(!patient.treino_liberado){fail('Seu treino ainda não foi liberado.');return}state.patient=patient;const [{data:workouts,error:wErr},{data:progress},{data:history,error:hErr}]=await Promise.all([sb.from('treino_programas').select('*').eq('paciente_id',patient.id).eq('status','ativo').order('ordem'),sb.from('treino_progresso').select('dados').eq('paciente_id',patient.id).maybeSingle(),sb.from('treino_execucoes').select('*').eq('paciente_id',patient.id).order('iniciado_em',{ascending:false}).limit(180)]);if(wErr){fail('Não foi possível carregar os treinos agora.');return}state.workouts=workouts||[];state.history=hErr?[]:(history||[]);if(progress?.dados)state.progress={exerciseState:{},activeWorkoutId:null,generalObs:{},sessions:{},...progress.dados};if(!state.workouts.length){fail('Ainda não há treino ativo vinculado à sua conta.');return}if(!state.progress.activeWorkoutId||!state.workouts.some(w=>w.id===state.progress.activeWorkoutId))state.progress.activeWorkoutId=state.workouts[0].id;state.active=state.workouts.find(w=>w.id===state.progress.activeWorkoutId)||state.workouts[0];const ids=state.workouts.map(w=>w.id);const {data:all}=await sb.from('treino_exercicios').select('*').in('treino_id',ids).order('bloco_ordem').order('ordem');state.allExercises=all||[];loadActiveExercises();$('#loading').classList.add('hidden');startTicks();render()}
function fail(msg){$('#loading').classList.add('hidden');$('#app').innerHTML=`<main class="page"><div class="hero"><h1>Área de treinamento</h1><p>${esc(msg)}</p><div style="margin-top:15px"><a class="btn secondary" href="/paciente">Voltar</a></div></div></main>`}
function loadActiveExercises(){state.exercises=state.allExercises.filter(e=>e.treino_id===state.active?.id).sort((a,b)=>(a.bloco_ordem-b.bloco_ordem)||(a.ordem-b.ordem))}
function startTicks(){clearInterval(state.tick);state.tick=setInterval(()=>{const s=session();if(s.started&&s.timerRunning&&!s.completed){s.elapsedSec=(s.elapsedSec||0)+1;const el=$('#mainTimer');if(el)el.textContent=formatTime(s.elapsedSec);if(s.elapsedSec%10===0)scheduleSave()}},1000);clearInterval(state.restTick);state.restTick=setInterval(()=>{const s=session(),r=s.rest;if(!r||r.paused)return;r.remaining=Math.max(0,(r.remaining||0)-1);if(r.remaining<=0){s.rest=null;scheduleSave();toast('Descanso concluído');renderRest()}else renderRest(false)},1000)}
function startWorkout(){const s=session();if(!s.started)setSession({started:true,timerRunning:true,elapsedSec:0,completed:false,completedAt:null});else setSession({timerRunning:!s.timerRunning});toast(!s.started?'Treino iniciado. Bom treino!':s.timerRunning?'Treino pausado':'Treino retomado');render()}
function restartWorkout(){if(!confirm('Reiniciar o treino? As marcações de séries e o cronômetro desta sessão serão apagados.'))return;for(const ex of state.exercises){const cur=exState(ex);saveEx(ex,{sets:new Array(Number(ex.series||0)).fill(false),load:cur.load,reps:cur.reps})}setSession({started:true,timerRunning:true,elapsedSec:0,rest:null,completed:false,completedAt:null,generalObs:''});render()}
function clearProgress(){if(!confirm('Limpar as marcações deste treino? As cargas registradas serão mantidas.'))return;for(const ex of state.exercises){const cur=exState(ex);saveEx(ex,{sets:new Array(Number(ex.series||0)).fill(false),load:cur.load,reps:cur.reps})}render()}
function startRest(ex){const sec=Number(ex.descanso_seg||0);if(!sec)return;const s=session();s.rest={exerciseId:ex.id,label:ex.nome,total:sec,remaining:sec,paused:false};scheduleSave();renderRest();}
function renderRest(full=true){let bar=$('#restBar');const r=session().rest;if(!r){if(bar)bar.remove();return}if(!bar){bar=document.createElement('div');bar.id='restBar';bar.className='rest-bar';document.body.appendChild(bar)}const pct=r.total?Math.max(0,Math.min(100,r.remaining/r.total*100)):0;bar.innerHTML=`<div class="rest-head"><div class="rest-title">Descanso · ${esc(r.label)}</div><div id="restTime" class="rest-time">${formatTime(r.remaining)}</div></div><div class="rest-track"><div class="rest-fill" style="width:${pct}%"></div></div><div class="rest-actions"><button id="restPause">${r.paused?'Retomar':'Pausar'}</button><button id="restRestart">Reiniciar</button><button id="restAdd">+30s</button><button id="restSkip">Pular</button></div>`;$('#restPause').onclick=()=>{r.paused=!r.paused;scheduleSave();renderRest()};$('#restRestart').onclick=()=>{r.remaining=r.total;r.paused=false;scheduleSave();renderRest()};$('#restAdd').onclick=()=>{r.total+=30;r.remaining+=30;scheduleSave();renderRest()};$('#restSkip').onclick=()=>{session().rest=null;scheduleSave();renderRest()}}
function completion(){let total=0,done=0,doneExercises=0;for(const ex of state.exercises){const st=exState(ex);total+=st.sets.length;done+=st.sets.filter(Boolean).length;if(st.sets.length&&st.sets.every(Boolean))doneExercises++}return{total,done,doneExercises,totalExercises:state.exercises.length,pct:total?Math.round(done/total*100):0}}
function ensureStarted(){const s=session();if(!s.started)setSession({started:true,timerRunning:true,elapsedSec:0,completed:false})}
function toggleSet(ex,idx){ensureStarted();const st=exState(ex);st.sets[idx]=!st.sets[idx];saveEx(ex,st);if(st.sets[idx])startRest(ex);const c=completion();render();if(c.total&&c.done===c.total)setTimeout(()=>finishWorkout(true),150)}
function toggleAll(ex){ensureStarted();const st=exState(ex);const all=st.sets.every(Boolean);st.sets=new Array(st.sets.length).fill(!all);saveEx(ex,st);render();const c=completion();if(!all&&c.total&&c.done===c.total)setTimeout(()=>finishWorkout(true),150)}
function setField(ex,key,val){const st=exState(ex);st[key]=val;saveEx(ex,st)}
function plannedReps(ex,st){const val=parseFloat(st.reps);if(Number.isFinite(val)&&val>0)return val;const m=String(ex.repeticoes||'').match(/\d+/);return m?Number(m[0]):0}
function sessionSnapshot(){let volume=0,maxLoad=0;const exercises=state.exercises.map(ex=>{const st=exState(ex),doneSets=st.sets.filter(Boolean).length,load=parseFloat(st.load)||0,reps=plannedReps(ex,st);volume+=doneSets*load*reps;maxLoad=Math.max(maxLoad,load);return{id:ex.id,name:ex.nome,sets:st.sets,doneSets,load,reps,plannedReps:ex.repeticoes||'',restSec:ex.descanso_seg||0,block:ex.bloco_nome||'',videoUrl:ex.video_url||''}});return{workoutName:state.active.nome,workoutCode:state.active.codigo||'',exerciseState:state.progress.exerciseState,exercises,volume:Math.round(volume),maxLoad}}
async function finishWorkout(auto=false){const s=session();if(s.completed)return;const c=completion();if(!auto&&c.done<c.total&&!confirm('Ainda existem séries não marcadas. Deseja concluir mesmo assim?'))return;ensureStarted();s.timerRunning=false;s.rest=null;const now=new Date();const dur=Math.max(1,Number(s.elapsedSec)||1);const snap=sessionSnapshot();const payload={paciente_id:state.patient.id,treino_id:state.active.id,iniciado_em:new Date(now.getTime()-dur*1000).toISOString(),finalizado_em:now.toISOString(),duracao_seg:dur,concluido:true,observacoes:s.generalObs||'',dados:snap};const {data,error}=await sb.from('treino_execucoes').insert(payload).select('*').single();if(error){toast('Não foi possível registrar a conclusão agora.');return}s.completed=true;s.completedAt=now.toISOString();scheduleSave();if(data)state.history.unshift(data);showCompleted(dur,snap.volume);render()}
function showCompleted(dur,volume){$('#overlay').innerHTML=`<div class="completed"><div class="completed-card"><div class="completed-icon">✓</div><h2>Treino concluído!</h2><p>Excelente trabalho. Sua sessão foi registrada na evolução.</p><div class="summary-row" style="margin:18px 0"><div class="summary-box"><b>${formatTime(dur)}</b><span>Tempo total</span></div><div class="summary-box"><b>${volume} kg</b><span>Volume movimentado</span></div></div><button class="btn" id="closeCompleted">Continuar</button></div></div>`;$('#closeCompleted').onclick=()=>{$('#overlay').innerHTML='';state.tab='evolucao';resetSessionForNext();render()}}
function resetSessionForNext(){for(const ex of state.exercises){const st=exState(ex);saveEx(ex,{sets:new Array(st.sets.length).fill(false),load:st.load,reps:st.reps})}setSession({started:false,timerRunning:false,elapsedSec:0,rest:null,completed:false,completedAt:null,generalObs:''})}
async function switchWorkout(id){if(id===state.active?.id)return;await saveProgress();state.progress.activeWorkoutId=id;state.active=state.workouts.find(w=>w.id===id)||state.workouts[0];loadActiveExercises();scheduleSave();render()}
function historyData(h){const d=h.dados||{};return{volume:Number(d.volume)||0,maxLoad:Number(d.maxLoad)||0,exercises:Array.isArray(d.exercises)?d.exercises:[],name:d.workoutName||state.workouts.find(w=>w.id===h.treino_id)?.nome||'Treino'}}
function evo(){const hist=state.history.filter(h=>h.concluido);const now=new Date(),weekAgo=new Date(now);weekAgo.setDate(now.getDate()-7);const monthAgo=new Date(now);monthAgo.setDate(now.getDate()-30);const week=hist.filter(h=>new Date(h.iniciado_em)>=weekAgo),month=hist.filter(h=>new Date(h.iniciado_em)>=monthAgo);const totalTime=hist.reduce((a,h)=>a+Number(h.duracao_seg||0),0),weekTime=week.reduce((a,h)=>a+Number(h.duracao_seg||0),0),monthTime=month.reduce((a,h)=>a+Number(h.duracao_seg||0),0),weekVolume=week.reduce((a,h)=>a+historyData(h).volume,0),monthVolume=month.reduce((a,h)=>a+historyData(h).volume,0);const counts={},prs={};let maxLoad=0;for(const h of hist){for(const ex of historyData(h).exercises){counts[ex.name]=(counts[ex.name]||0)+(Number(ex.doneSets)||0);const l=Number(ex.load)||0;maxLoad=Math.max(maxLoad,l);if(l>(prs[ex.name]||0))prs[ex.name]=l}}const topExercise=Object.entries(counts).sort((a,b)=>b[1]-a[1])[0]?.[0]||'—';const uniqueDays=[...new Set(hist.map(h=>dayKey(h.iniciado_em)))].sort();let longest=0,current=0,run=0,prev=null;for(const k of uniqueDays){const d=new Date(k+'T12:00:00');if(prev&&Math.round((d-prev)/86400000)===1)run++;else run=1;longest=Math.max(longest,run);prev=d}if(uniqueDays.length){const last=new Date(uniqueDays.at(-1)+'T12:00:00'),today=new Date();today.setHours(12,0,0,0);const diff=Math.round((today-last)/86400000);if(diff<=1){current=1;for(let i=uniqueDays.length-2;i>=0;i--){const d1=new Date(uniqueDays[i]+'T12:00:00'),d2=new Date(uniqueDays[i+1]+'T12:00:00');if(Math.round((d2-d1)/86400000)===1)current++;else break}}}const xp=hist.length*100;const level=Math.floor(xp/500)+1;const into=xp%500;const achievements=[['Primeiro passo','1 treino',hist.length>=1,'✓'],['Consistência','5 treinos',hist.length>=5,'5'],['Em ritmo','10 treinos',hist.length>=10,'10'],['Sequência','3 dias seguidos',longest>=3,'⚡'],['Foco total','5 dias seguidos',longest>=5,'🔥'],['1000 minutos','Tempo acumulado',totalTime>=60000,'⏱'],['Carga alta','50 kg em um exercício',maxLoad>=50,'↑'],['Veterano','25 treinos',hist.length>=25,'25'],['Elite','50 treinos',hist.length>=50,'★']];return{hist,totalTime,week,month,weekTime,monthTime,weekVolume,monthVolume,topExercise,maxLoad,prs,uniqueDays,longest,current,xp,level,into,achievements}}
function heatmap(days){const active=new Set(days),cols=[];const end=new Date();end.setHours(12,0,0,0);const start=new Date(end);start.setDate(end.getDate()-17*7-6);for(let w=0;w<18;w++){const cells=[];for(let d=0;d<7;d++){const x=new Date(start);x.setDate(start.getDate()+w*7+d);cells.push(`<div class="heatday ${active.has(dayKey(x))?'on':''}" title="${dayKey(x)}"></div>`)}cols.push(`<div class="heatcol">${cells.join('')}</div>`)}return cols.join('')}
function renderEvolution(){const e=evo(),prs=Object.entries(e.prs).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]).slice(0,10);return `<section class="hero"><p class="eyebrow">Evolução</p><h1>Seu histórico de treinos</h1><p>${e.hist.length} treinos registrados</p></section><section class="evo-stats"><div class="evo-stat"><b>${formatTime(e.totalTime)}</b><span>Tempo total treinado</span></div><div class="evo-stat"><b>${esc(e.topExercise)}</b><span>Exercício mais realizado</span></div><div class="evo-stat"><b>${e.maxLoad?e.maxLoad+' kg':'—'}</b><span>Maior carga registrada</span></div></section><div class="section-head"><h2>Resumo</h2><p>Consistência e volume</p></div><section class="summary-row"><div class="summary-box"><b>${e.week.length} treinos</b><span>Resumo da semana</span><div class="summary-detail">${formatTime(e.weekTime)} · ${Math.round(e.weekVolume)} kg movimentados</div></div><div class="summary-box"><b>${e.month.length} treinos</b><span>Resumo do mês</span><div class="summary-detail">${formatTime(e.monthTime)} · ${Math.round(e.monthVolume)} kg movimentados</div></div></section><div class="section-head"><h2>Frequência de treinos</h2><p>Últimas 18 semanas</p></div><section class="evo-card"><div class="heatmap">${heatmap(e.uniqueDays)}</div></section><div class="section-head"><h2>Nível e consistência</h2><p>Seu progresso</p></div><section class="evo-card"><div class="level-row"><div><p class="eyebrow">Nível ${e.level}</p><div class="level-num">${e.xp} XP</div></div><div class="muted" style="font-size:12px">Sequência atual: <b>${e.current} dias</b></div></div><div class="xp-track"><div class="xp-fill" style="width:${e.into/5}%"></div></div><div class="muted" style="font-size:11px">${e.into} / 500 XP para o nível ${e.level+1} · Maior sequência: ${e.longest} dias</div></section><div class="section-head"><h2>Conquistas</h2><p>${e.achievements.filter(a=>a[2]).length} de ${e.achievements.length} desbloqueadas</p></div><section class="achievement-grid">${e.achievements.map(a=>`<div class="achievement ${a[2]?'':'locked'}"><div class="achievement-icon">${a[3]}</div><div class="achievement-title">${a[0]}</div><div class="achievement-sub">${a[1]}</div></div>`).join('')}</section><div class="section-head"><h2>Recordes pessoais</h2><p>Maiores cargas registradas</p></div><section class="evo-card">${prs.length?`<div class="pr-grid">${prs.map(([n,v])=>`<div class="pr"><b>${esc(n)}</b><span>${v} kg</span></div>`).join('')}</div>`:'<div class="empty">Registre cargas nos treinos para começar a acompanhar seus recordes.</div>'}</section><div class="section-head"><h2>Sessões recentes</h2><p>Últimos treinos</p></div><section class="evo-card"><div class="history">${e.hist.length?e.hist.slice(0,12).map(h=>{const d=historyData(h);return `<div class="history-row"><div><div class="history-title">${esc(d.name)}</div><div class="history-meta">${fmtDate(h.iniciado_em)}</div></div><div class="history-stats">${formatTime(h.duracao_seg)}<br>${Math.round(d.volume)} kg</div></div>`}).join(''):'<div class="empty">Nenhuma sessão concluída ainda.</div>'}</div></section>`}
function grouped(){const map=new Map();for(const ex of state.exercises){const key=`${ex.bloco_ordem||0}:${ex.bloco_nome||'Exercícios'}`;if(!map.has(key))map.set(key,{title:ex.bloco_nome||'Exercícios',items:[]});map.get(key).items.push(ex)}return[...map.values()]}
function renderExercise(ex){const st=exState(ex),all=st.sets.length&&st.sets.every(Boolean),rest=Number(ex.descanso_seg||0),badges=[ex.rir?`RIR ${esc(ex.rir)}`:'',ex.rpe?`RPE ${esc(ex.rpe)}`:''].filter(Boolean);const drop=/drop/i.test(ex.observacoes||'');if(drop)badges.push('Drop Set');return `<article class="exercise-card ${all?'done':''}"><div class="exercise-top"><div class="exercise-main"><div class="exercise-name">${esc(ex.nome)}</div><div class="exercise-meta">${Number(ex.series||0)} séries · ${esc(ex.repeticoes||'repetições livres')}${rest?' · '+(rest>=60?(rest%60===0?rest/60+'min':Math.floor(rest/60)+':'+String(rest%60).padStart(2,'0')):rest+'s')+' descanso':''}</div>${badges.length?`<div class="badges">${badges.map(b=>`<span class="badge">${b}</span>`).join('')}</div>`:''}</div><button class="check-all ${all?'done':''}" data-all="${ex.id}" aria-label="Marcar exercício completo">${all?'✓':''}</button></div><div class="exercise-body"><div class="set-row">${st.sets.map((done,i)=>`<button class="set-pip ${done?'done':''}" data-ex="${ex.id}" data-set="${i}">${i+1}</button>`).join('')}</div><div class="inputs"><div class="field"><label>Carga</label><input inputmode="decimal" data-field="load" data-ex="${ex.id}" value="${esc(st.load)}" placeholder="${ex.carga_inicial!=null?esc(ex.carga_inicial)+' kg':'kg'}"></div><div class="field"><label>Repetições realizadas</label><input inputmode="numeric" data-field="reps" data-ex="${ex.id}" value="${esc(st.reps)}" placeholder="${esc(ex.repeticoes||'reps')}"></div></div>${ex.observacoes?`<div class="note">${esc(ex.observacoes)}</div>`:''}<div class="exercise-actions">${ex.video_url?`<a class="video" href="${esc(ex.video_url)}" target="_blank" rel="noopener">▶ Ver execução</a>`:'<span></span>'}<span class="rest-label">${rest?`Ao marcar uma série: descanso de ${rest}s inicia automaticamente`:''}</span></div></div></article>`}
function renderTraining(){const s=session(),c=completion();return `<section class="hero"><p class="eyebrow">Treino de hoje</p><h1>${esc(state.active?.nome||'Seu treino')}</h1><p>${esc(state.active?.objetivo||'Marque as séries concluídas, acompanhe o descanso e registre sua evolução.')}</p><div class="hero-bottom"><div><div class="eyebrow">Cronômetro do treino</div><div class="timer-main" id="mainTimer">${formatTime(s.elapsedSec)}</div><div id="saveStatus" class="save ok">Salvo automaticamente</div></div><div class="timer-actions"><button class="btn" id="startWorkout">${!s.started?'Iniciar treino':s.timerRunning?'Pausar':'Retomar'}</button></div></div></section><div class="workout-tabs">${state.workouts.map(w=>`<button class="workout-tab ${w.id===state.active.id?'active':''}" data-workout="${w.id}">${esc(w.nome)}</button>`).join('')}</div><section class="progress-card"><div class="progress-big">${c.pct}%</div><div class="progress-track"><div class="progress-fill" style="width:${c.pct}%"></div></div><div class="progress-meta">${c.done}/${c.total} séries · ${c.doneExercises}/${c.totalExercises} exercícios</div></section>${grouped().map(b=>`<section class="block"><div class="section-head"><div><h2 class="block-title">${esc(b.title)}</h2></div><p>${b.items.length} exercícios</p></div>${b.items.map(renderExercise).join('')}</section>`).join('')}<section class="notes-card"><div class="field"><label>Observações do treino</label><textarea id="generalObs" rows="4" placeholder="Como você se sentiu hoje? Alguma dor, dificuldade ou ajuste a registrar...">${esc(s.generalObs||'')}</textarea></div></section><section class="actions-card"><button class="btn" id="finishWorkout">Concluir treino</button><button class="btn secondary" id="restartWorkout">Reiniciar treino</button><button class="btn ghost" id="clearProgress">Limpar progresso</button></section><section class="notes-card"><p class="eyebrow">Orientações gerais</p><div class="note">${esc(GENERAL_GUIDANCE)}</div></section>`}
function render(){if(!state.patient)return;applyTheme();$('#app').innerHTML=`<main class="page"><header class="header"><div class="header-left"><a class="back" href="/paciente">← Área do paciente</a><div class="logo">NUTRI THALES</div></div><div class="header-right"><button class="theme" id="theme">${state.theme==='dark'?'Claro':'Escuro'}</button><div class="avatar">${esc(first(state.patient.nome).charAt(0).toUpperCase())}</div></div></header><nav class="nav"><button class="nav-btn ${state.tab==='treino'?'active':''}" data-tab="treino">Treino</button><button class="nav-btn ${state.tab==='evolucao'?'active':''}" data-tab="evolucao">Evolução</button><button class="nav-btn locked">Alimentação <span class="lock">em breve</span></button><button class="nav-btn locked">Alongamento <span class="lock">em breve</span></button><button class="nav-btn locked">Check-in <span class="lock">em breve</span></button><button class="nav-btn locked">Agenda <span class="lock">em breve</span></button></nav>${state.tab==='treino'?renderTraining():renderEvolution()}</main>`;$('#theme').onclick=()=>{state.theme=state.theme==='dark'?'light':'dark';localStorage.setItem('training-theme',state.theme);render()};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;render()});if(state.tab==='treino'){document.querySelectorAll('[data-workout]').forEach(b=>b.onclick=()=>switchWorkout(b.dataset.workout));document.querySelectorAll('[data-set]').forEach(b=>b.onclick=()=>toggleSet(state.exercises.find(e=>e.id===b.dataset.ex),Number(b.dataset.set)));document.querySelectorAll('[data-all]').forEach(b=>b.onclick=()=>toggleAll(state.exercises.find(e=>e.id===b.dataset.all)));document.querySelectorAll('[data-field]').forEach(i=>i.oninput=()=>setField(state.exercises.find(e=>e.id===i.dataset.ex),i.dataset.field,i.value));$('#startWorkout').onclick=startWorkout;$('#restartWorkout').onclick=restartWorkout;$('#clearProgress').onclick=clearProgress;$('#finishWorkout').onclick=()=>finishWorkout(false);$('#generalObs').oninput=e=>{session().generalObs=e.target.value;scheduleSave()};renderSave();renderRest()}else renderRest();}
boot();
</script></body></html>
