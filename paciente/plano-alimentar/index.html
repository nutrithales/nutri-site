<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Plano Alimentar | Nutri Thales Rosa</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
@font-face{font-family:Galano;src:url('/assets/fonts/GalanoGrotesqueAltRegular.otf') format('opentype');font-weight:400;font-display:swap}@font-face{font-family:Galano;src:url('/assets/fonts/GalanoGrotesqueAltSemiBold.otf') format('opentype');font-weight:600;font-display:swap}@font-face{font-family:Galano;src:url('/assets/fonts/GalanoGrotesqueAltBold.otf') format('opentype');font-weight:700;font-display:swap}
:root{--ink:#14181a;--muted:#66716b;--green:#1adc7f;--green-dark:#0fae62;--cream:#faf9f6;--line:#e7ebe9;--card:#fff;--soft:#effaf4;--shadow:0 16px 50px -28px rgba(20,24,26,.28)}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Galano,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}a{color:inherit;text-decoration:none}.shell{width:min(100%,980px);margin:auto;padding:24px 16px 54px}.top{display:flex;align-items:center;justify-content:space-between;gap:14px}.logo{display:block;width:auto;max-width:145px;max-height:44px}.back{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:9px 13px;border:1px solid var(--line);border-radius:999px;background:#fff;font-size:.8rem;font-weight:700}.hero{margin-top:28px;padding:24px;border-radius:26px;background:#132019;color:#fff}.eyebrow{margin:0 0 8px;text-transform:uppercase;letter-spacing:.13em;font-size:.7rem;font-weight:700;color:var(--green)}.hero h1{margin:0;font-size:clamp(2rem,6vw,3.4rem);letter-spacing:-.045em;line-height:1}.hero p{margin:11px 0 0;color:#bed0c5;line-height:1.5}.meta-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px}.meta-card{padding:13px;border-radius:15px;background:rgba(255,255,255,.08)}.meta-card b{display:block;font-size:1.1rem}.meta-card span{font-size:.72rem;color:#bed0c5}.meal{margin-top:18px;background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);overflow:hidden}.meal-head{padding:19px 20px;background:#f6f8f6;border-bottom:1px solid var(--line)}.meal-head h2{margin:0;font-size:1.16rem}.meal-head p{margin:7px 0 0;color:var(--muted);font-size:.86rem;line-height:1.45}.option{padding:20px}.option+.option{border-top:1px solid var(--line)}.option-title{font-size:.95rem;font-weight:700;margin-bottom:12px}.item{display:flex;justify-content:space-between;gap:18px;padding:9px 0;border-bottom:1px dashed #edf0ee}.item:last-child{border-bottom:0}.item-name{font-size:.93rem;font-weight:600}.item-qtd{text-align:right;color:var(--muted);font-size:.86rem;white-space:nowrap}.option-note{margin-top:13px;padding:12px 13px;border-radius:13px;background:var(--soft);color:#3e5648;font-size:.84rem;line-height:1.5}.state{margin:12vh auto;max-width:520px;text-align:center;color:var(--muted);line-height:1.6}.state b{display:block;color:var(--ink);font-size:1.15rem;margin-bottom:6px}.hidden{display:none!important}@media(max-width:680px){.shell{padding:18px 12px 44px}.hero{padding:20px;border-radius:21px}.meta-grid{grid-template-columns:repeat(2,1fr)}.meal{border-radius:18px}.meal-head,.option{padding:16px}.item{align-items:flex-start}.item-qtd{white-space:normal;max-width:44%}}
</style>
</head>
<body>
<main class="shell">
  <header class="top"><img class="logo" src="/assets/logo-thales.png" alt="Nutri Thales Rosa"><a class="back" href="/paciente">← Área do paciente</a></header>
  <div id="loading" class="state"><b>Carregando seu plano alimentar</b>Buscando a versão mais recente liberada para você.</div>
  <div id="error" class="state hidden"></div>
  <div id="app" class="hidden"></div>
</main>
<script>
const SUPABASE_URL='https://xwihrxinweeadtcouhoo.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_9rdUCvfgWydLr4vA-uQvHQ_FWwgggLk';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fail(msg){$('loading').classList.add('hidden');$('error').classList.remove('hidden');$('error').innerHTML='<b>Plano alimentar indisponível</b>'+esc(msg)}
function normalizeName(v){return String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()}
function measureText(medidas,gramas,nome){if(!Array.isArray(medidas)||!gramas)return '';const validas=medidas.map(m=>({g:Number(m.peso_g??m.gramas),u:String(m.unidade??m.nome??'').trim()})).filter(m=>m.g>0&&m.u);if(!validas.length)return '';let best=null;for(const m of validas){const units=gramas/m.g,rounded=Math.round(units*2)/2,error=Math.abs(units-rounded),score=(rounded>=.5&&rounded<=8?0:10)+error;if(!best||score<best.score)best={...m,rounded,score}}if(!best||best.rounded<=0)return '';const unit=best.rounded.toLocaleString('pt-BR',{maximumFractionDigits:1})+' '+best.u.toLowerCase();const n=normalizeName(nome);if((n.includes('banana')||n.includes('maca'))&&best.u.toLowerCase().includes('unidade'))return unit;return '≈ '+unit}
function itemQuantity(item){if(item.papel_macro==='livre')return 'livre';if(item.papel_macro==='vegetal_b')return '1 porção';const q=Number(item.quantidade_g||0);if(!q)return '';const medida=measureText(item.alimento?.medidas_caseiras,q,item.alimento?.nome);const n=normalizeName(item.alimento?.nome);if(medida&&!medida.startsWith('≈')&&(n.includes('banana')||n.includes('maca')))return medida;return medida?`${q.toLocaleString('pt-BR')} g · ${medida}`:`${q.toLocaleString('pt-BR')} g`}
function render(plan,profile){const meals=[...(plan.refeicoes||[])].sort((a,b)=>(a.ordem||0)-(b.ordem||0));const mealsHtml=meals.map(meal=>{const map=new Map();for(const item of [...(meal.itens||[])].sort((a,b)=>(a.ordem||0)-(b.ordem||0))){const n=item.opcao_numero||1;if(!map.has(n))map.set(n,{numero:n,nome:item.opcao_nome||null,itens:[]});map.get(n).itens.push(item)}const obsMap=meal.observacoes_opcoes||{};const options=[...map.values()].sort((a,b)=>a.numero-b.numero).map(op=>{const itens=op.itens.map(item=>{const tipoA=item.papel_macro==='livre',tipoB=item.papel_macro==='vegetal_b';const nome=tipoA?'Vegetais Tipo A':tipoB?'Vegetais Tipo B':item.receita?.nome||item.alimento?.nome||'Item';return `<div class="item"><div class="item-name">${esc(nome)}</div><div class="item-qtd">${esc(itemQuantity(item))}</div></div>`}).join('');const note=obsMap[String(op.numero)]||'';return `<section class="option"><div class="option-title">${esc(op.nome||`Opção ${op.numero}`)}</div>${itens}${note?`<div class="option-note">${esc(note)}</div>`:''}</section>`}).join('');return `<article class="meal"><div class="meal-head"><h2>${esc(meal.nome)}</h2>${meal.observacoes?`<p>${esc(meal.observacoes)}</p>`:''}</div>${options}</article>`}).join('');$('app').innerHTML=`<section class="hero"><p class="eyebrow">Plano alimentar</p><h1>${esc(plan.titulo||'Seu plano alimentar')}</h1><p>${esc(profile?.nome?`Plano liberado para ${profile.nome}.`: 'Sua estratégia nutricional atual.')}</p><div class="meta-grid"><div class="meta-card"><b>${Number(plan.meta_kcal||0).toLocaleString('pt-BR')}</b><span>kcal</span></div><div class="meta-card"><b>${Number(plan.meta_proteina_g||0).toLocaleString('pt-BR')} g</b><span>proteína</span></div><div class="meta-card"><b>${Number(plan.meta_carboidrato_g||0).toLocaleString('pt-BR')} g</b><span>carboidrato</span></div><div class="meta-card"><b>${Number(plan.meta_gordura_g||0).toLocaleString('pt-BR')} g</b><span>gorduras</span></div></div></section>${mealsHtml}`;$('loading').classList.add('hidden');$('app').classList.remove('hidden')}
async function boot(){const {data:{session}}=await sb.auth.getSession();if(!session?.user){location.replace('/paciente');return}const [{data:profile},{data:pub,error:pubErr}]=await Promise.all([sb.from('pacientes').select('nome').eq('auth_id',session.user.id).maybeSingle(),sb.from('planos_alimentares').select('id,titulo,tipo,plano_estruturado_id').eq('auth_id',session.user.id).eq('ativo',true).order('id',{ascending:false}).limit(1).maybeSingle()]);if(pubErr||!pub?.plano_estruturado_id){fail('Nenhum plano ativo foi encontrado para sua conta.');return}const {data:plan,error}=await sb.from('planos_estruturados').select(`id,titulo,status,observacoes,meta_kcal,meta_proteina_g,meta_carboidrato_g,meta_gordura_g,refeicoes:plano_refeicoes(id,nome,ordem,observacoes,observacoes_opcoes,itens:plano_refeicao_itens(id,ordem,opcao_numero,opcao_nome,papel_macro,quantidade_g,alimento:alimentos(id,nome,medidas_caseiras),receita:receitas(id,nome)))`).eq('id',pub.plano_estruturado_id).eq('status','finalizado').maybeSingle();if(error||!plan){fail('O plano foi localizado, mas não foi possível carregar seu conteúdo agora.');return}render(plan,profile)}
boot();
</script>
</body>
</html>
