<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel da Agenda | Nutri Thales</title><style>:root{--g:#1adc7f;--d:#14181a;--m:#647069;--l:#e4e9e6}*{box-sizing:border-box}body{margin:0;background:#f5f8f6;color:var(--d);font-family:Inter,system-ui,sans-serif}header{background:var(--d);color:#fff;padding:20px}.head,main{max-width:980px;margin:auto}.head{display:flex;justify-content:space-between;align-items:center}.head b{color:var(--g)}main{padding:36px 20px}h1{letter-spacing:-.05em}.login,.event{background:#fff;border:1px solid var(--l);border-radius:16px;padding:20px;margin-bottom:12px}.login{max-width:440px;margin:60px auto}input{width:100%;padding:12px;border:1px solid var(--l);border-radius:9px;margin:8px 0 12px}.btn{border:0;border-radius:999px;background:var(--g);font-weight:800;padding:11px 18px;cursor:pointer}.danger{background:#fff0ef;color:#b42318;border:1px solid #ffd2cf}.event{display:grid;grid-template-columns:140px 1fr auto;gap:16px;align-items:center}.date{font-weight:800}.date small,.meta{display:block;color:var(--m);font-size:.82rem;margin-top:5px}.hidden{display:none}.empty{text-align:center;color:var(--m);padding:50px}@media(max-width:650px){.event{grid-template-columns:1fr}.event .btn{justify-self:start}}</style></head><body><header><div class="head"><strong>NUTRI <b>THALES</b></strong><span>Painel da agenda</span></div></header><main><section id="login" class="login"><h1>Entrar</h1><p>Use a senha administrativa cadastrada na Vercel.</p><input id="password" type="password" placeholder="Senha"><button class="btn" onclick="enter()">Acessar painel</button><p id="error" style="color:#b42318"></p></section><section id="panel" class="hidden"><div style="display:flex;justify-content:space-between;align-items:center"><div><h1>Próximos atendimentos</h1><p class="meta">Consultas sincronizadas com o Google Agenda</p></div><button class="btn" onclick="load()">Atualizar</button></div><div id="events"></div></section></main><script>let pass='';const $=s=>document.querySelector(s);async function enter(){pass=$('#password').value;await load(true)}async function load(first=false){const r=await fetch('/api/admin',{headers:{authorization:'Bearer '+pass}});if(!r.ok){$('#error').textContent='Senha incorreta ou integração ainda não configurada.';return}$('#login').classList.add('hidden');$('#panel').classList.remove('hidden');const j=await r.json();$('#events').innerHTML=j.events.length?j.events.map(e=>{const d=new Date(e.start);return `<article class="event"><div class="date">${d.toLocaleDateString('pt-BR')}<small>${d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}</small></div><div><strong>${e.title}</strong><span class="meta">${e.location||''}</span></div><button class="btn danger" onclick="cancelEvent('${e.id}')">Cancelar</button></article>`}).join(''):'<div class="empty">Nenhum atendimento agendado nos próximos 60 dias.</div>'}async function cancelEvent(id){if(!confirm('Cancelar este atendimento e avisar o paciente?'))return;const r=await fetch('/api/admin?id='+encodeURIComponent(id),{method:'DELETE',headers:{authorization:'Bearer '+pass}});if(r.ok)load();else alert('Não foi possível cancelar.')}</script></body></html>
